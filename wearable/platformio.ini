; BloomBack Band firmware.
; Cheap band (ESP32-C3 + 0.42" OLED + MPU6050):  pio run -e c3-oled -t upload
; Reference watch (M5StickC Plus2):              pio run -e m5stickc-plus2 -t upload
; Serial monitor:                                pio device monitor
; Core + protocol tests on the Mac:              pio test -e native
;
; src/common/ is shared by both boards (settings in NVS, minute files in LittleFS,
; the protocol host). Each board has its own folder with its own setup()/loop().

[platformio]
default_envs = c3-oled

[env:c3-oled]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions_c3.csv
monitor_speed = 115200
build_src_filter = +<common/> +<c3/>
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.6
  olikraus/U8g2@^2.36.5
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Isrc/common
  -DBB_BOARD=\"c3-oled\"
  -DBB_DEVICE_NAME=\"BloomBack\ Band\ (ESP32-C3)\"
  ; Pins (override with -D in your own env if the board differs):
  ;   -DBB_SDA=5 -DBB_SCL=6 -DBB_BTN=9 -DBB_VIBE_PIN=4 -DBB_BAT_PIN=3 -DBB_BAT_DIVIDER=2.0
  ;   -DBB_CHG_PIN=10   (charger "CHRG" output, low while charging)

[env:cyd]
; Demo on the board Son has (19 Nov): ESP32-2432S024 family, orange PCB: ESP32-WROOM-32 (classic ESP32,
; CH340 USB-C), 2.4" 320x240 ST7789 display on HSPI, XPT2046 resistive touch on the same SPI bus, SD slot,
; battery connector. Same firmware as c3-oled with big-screen drawing and pen taps (src/cyd/ui.cpp).
; Checked on the board 19 Nov: ST7789 (RDDID 81 81 B3), backlight GPIO27. No motion sensor on the board:
; a later MPU6050 goes on SDA 21 / SCL 22.
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions_c3.csv
monitor_speed = 115200
build_src_filter = +<common/> +<c3/> -<c3/ui.cpp> +<cyd/>
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.6
  bodmer/TFT_eSPI@^2.5.43
build_flags =
  -Isrc/common
  -DBB_BOARD=\"cyd\"
  -DBB_DEVICE_NAME=\"BloomBack\ Band\ (ESP32\ demo\ board)\"
  -DBB_BTN=0
  -DBB_SDA=21
  -DBB_SCL=22
  -DBB_SCREEN_ON_MS=120000
  -DBB_DEMO_STEPS=1   ; simulated steps ONLY while no MPU6050 answers; labelled on screen
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_GFXFF=1
  -DBB_TOUCH=1
  -DTOUCH_CS=33
  -DSPI_TOUCH_FREQUENCY=2500000
  ; Other boards of this family: ILI9341 panel -> -DILI9341_2_DRIVER=1 instead of ST7789_DRIVER (and maybe
  ; -DBB_INVERT); 2.8" ESP32-2432S028 -> -DTFT_BL=21 and BB_SDA=27; upside down -> -DBB_ROTATION=3.

[env:m5stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_src_filter = +<common/> +<m5/>
lib_deps =
  m5stack/M5Unified@^0.2.2
build_flags =
  -Isrc/common
  -DBB_BOARD=\"m5stickc-plus2\"
  -DBB_DEVICE_NAME=\"BloomBack\ Band\ (M5StickC\ Plus2)\"

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
